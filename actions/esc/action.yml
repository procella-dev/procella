# Mirrored from pulumi/esc-action v3.2.1 (57e332b6dfb0d7edcf6cb813ee9a98b9665f12c2).
# dist/index.js is the byte-for-byte upstream bundle so environment injection and
# dynamic step outputs retain upstream behavior. Only the action identity and
# `cloud-url` description/default differ from upstream action.yml.
name: 'Procella ESC'
description: 'Install the Pulumi CLI and inject environment variables from a Procella ESC environment.'
branding:
  icon: unlock
  color: purple
author: 'Procella'
inputs:
  version:
    description: 'Version of the Pulumi CLI to install (e.g. "3.246.0"). If omitted, installs the latest.'
    required: false
    default: ''
  environment:
    description: 'The ESC environment to pull environment variables from.'
    required: false
    default: ''
  keys:
    description: 'A comma-separated list of specific keys to inject from within the ESC values.environmentVariables object. E.g. "NPM_TOKEN,SLACK_WEBHOOK_URL".'
    required: false
    default: ''
  cloud-url:
    description: 'The URL of the Pulumi Cloud API. Defaults to Procella production (https://api.procella.cloud).'
    required: false
    default: 'https://api.procella.cloud'
  export-environment-variables:
    description: "Whether or not to export environment variables. All environment variables will always be available in the 'env' step output."
    required: false
  oidc-auth:
    description: 'When true, the ESC action will exchange the GitHub workflow OIDC token for a Pulumi Access Token. Requires id-token: write permission.'
    required: false
    default: ''
  oidc-organization:
    description: 'The name of the Pulumi organization to use for OIDC token exchange. Required if oidc-auth is true.'
    required: false
    default: ''
  oidc-requested-token-type:
    description: 'The type of Pulumi Access Token to obtain. Required if oidc-auth is true.'
    required: false
    default: ''
  oidc-scope:
    description: 'The requested scopes for the Pulumi Access Token.'
    required: false
    default: ''
  oidc-token-expiration:
    description: 'The time-to-live for the Pulumi Access Token.'
    required: false
    default: ''
runs:
  using: 'node24'
  main: 'dist/index.js'
